name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-14
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 poppler-utils
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --version=8.1.2 --no-progress -y
          ffmpeg -version
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.3
          uv export --locked --extra dev --extra build --no-emit-project --format requirements.txt --output-file requirements.locked.txt
          python -m pip install --require-hashes -r requirements.locked.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PPTX_TOOLS_LANG: zh
          LANGUAGE: zh_CN
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: python scripts/run_tests_isolated.py

  video-e2e:
    name: Video E2E / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.3
          uv export --locked --extra dev --extra build --no-emit-project --format requirements.txt --output-file requirements.locked.txt
          python -m pip install --require-hashes -r requirements.locked.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff format --check src tests scripts
      - name: Run required video E2E tests
        run: python -m unittest tests.test_video_manager_e2e -v
