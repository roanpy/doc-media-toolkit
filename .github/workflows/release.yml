name: Build Release Candidates

on:
  workflow_dispatch:
    inputs:
      build_platform:
        description: "Platforms to build."
        required: true
        default: "windows"
        type: choice
        options:
          - windows
          - macos
          - all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MACOSX_DEPLOYMENT_TARGET: "13.0"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.build_platform == 'windows' && '{"include":[{"os":"windows-2025-vs2026","platform":"windows-x64"}]}' || github.event_name == 'workflow_dispatch' && inputs.build_platform == 'macos' && '{"include":[{"os":"macos-15-intel","platform":"macos-x64"},{"os":"macos-14","platform":"macos-arm64"}]}' || '{"include":[{"os":"macos-15-intel","platform":"macos-x64"},{"os":"macos-14","platform":"macos-arm64"},{"os":"windows-2025-vs2026","platform":"windows-x64"}]}') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg build tools and Poppler on macOS
        if: runner.os == 'macOS'
        env:
          # Keep runner package metadata stable during the candidate build.
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install nasm pkgconf poppler

      - name: Install Poppler on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '26.02.0-0'
          $assetName = "Release-$version.zip"
          $expectedSha256 = '993e4a94376ed712fafc7058d724ea0b943d118bbd2305cd9ed55174eb85cda5'
          $downloadUrl = "https://github.com/oschwartz10612/poppler-windows/releases/download/v$version/$assetName"
          $zipPath = Join-Path $env:RUNNER_TEMP $assetName
          $extractPath = Join-Path $env:RUNNER_TEMP 'poppler-windows'
          Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath
          $actualSha256 = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Poppler archive checksum mismatch: $actualSha256" }
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          $pdfimages = Get-ChildItem $extractPath -Recurse -Filter pdfimages.exe | Select-Object -First 1
          if (-not $pdfimages) { throw 'Poppler pdfimages.exe was not found after installation.' }
          $pdfimages.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $pdfimages.FullName -v

      - name: Set up MSYS2 for the source-pinned FFmpeg runtime
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
          path-type: inherit

      - name: Build FFmpeg 8.1.2 from pinned corresponding source on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          scripts/build_ffmpeg_runtime.sh "release-assets/ffmpeg-runtime"
          echo "PPTX_TOOLS_FFMPEG=$PWD/release-assets/ffmpeg-runtime/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "PPTX_TOOLS_FFPROBE=$PWD/release-assets/ffmpeg-runtime/bin/ffprobe" >> "$GITHUB_ENV"
          echo "PPTX_TOOLS_FFMPEG_LICENSE_DIR=$PWD/release-assets/ffmpeg-runtime/licenses" >> "$GITHUB_ENV"

      - name: Build FFmpeg 8.1.2 from pinned corresponding source on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: scripts/build_ffmpeg_runtime.sh "release-assets/ffmpeg-runtime"

      - name: Publish Windows FFmpeg build paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = (Resolve-Path "release-assets/ffmpeg-runtime").Path
          "PPTX_TOOLS_FFMPEG=$runtime\bin\ffmpeg.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PPTX_TOOLS_FFPROBE=$runtime\bin\ffprobe.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PPTX_TOOLS_FFMPEG_LICENSE_DIR=$runtime\licenses" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,dev]"
          python -m pip install pip-audit uv

      - name: Lint Python modules
        run: ruff check src tests scripts

      - name: Check Python formatting
        run: ruff format --check src tests scripts

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          # Exercise the product's documented first-launch language. Tests
          # that cover Chinese use explicit per-test overrides.
          PPTX_TOOLS_LANG: en
          PPTX_VIDEO_COMPACTOR_LANG: en
          PPTX_OUTPUT_WATERMARK_LANG: en
        run: python scripts/run_tests_isolated.py

      - name: Generate application icons
        run: python scripts/prepare_icons.py

      - name: Compile Python modules
        run: python -m py_compile pptx_tools_cli.py pptx_tools_gui.py scripts/build_standalone.py scripts/check_public_safety.py scripts/prepare_icons.py src/pptx_tools/cli.py src/pptx_tools/gui.py

      - name: Check public safety
        run: python scripts/check_public_safety.py

      - name: Build macOS GUI app
        if: runner.os == 'macOS'
        run: |
          python scripts/build_standalone.py --gui --clean --target-platform macos --bundle-ffmpeg --require-ffmpeg-bundle --dmg --dmg-output "release-assets/Doc-Media-Toolkit-${{ matrix.platform }}.dmg" --name "Doc Media Toolkit"
          test -x "dist/Doc Media Toolkit.app/Contents/Frameworks/ffmpeg"
          test -x "dist/Doc Media Toolkit.app/Contents/Frameworks/ffprobe"
          codesign --verify --deep --strict "dist/Doc Media Toolkit.app"
          verified=0
          for attempt in 1 2 3; do
            if hdiutil verify "release-assets/Doc-Media-Toolkit-${{ matrix.platform }}.dmg"; then
              verified=1
              break
            fi
            sleep 2
          done
          test "$verified" = 1
          QT_QPA_PLATFORM=offscreen "dist/Doc Media Toolkit.app/Contents/MacOS/Doc Media Toolkit" >"$RUNNER_TEMP/gui-smoke.log" 2>&1 &
          app_pid=$!
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true
          ditto -c -k --sequesterRsrc --keepParent "dist/Doc Media Toolkit.app" "release-assets/Doc-Media-Toolkit-${{ matrix.platform }}.zip"

          cp "release-assets/ffmpeg-runtime/FFMPEG-BUILD.txt" "release-assets/FFMPEG-${{ matrix.platform }}.txt"
          mv "release-assets/ffmpeg-runtime/Doc-Media-Toolkit-FFmpeg-8.1.2-corresponding-source.tar.gz" "release-assets/Doc-Media-Toolkit-FFmpeg-8.1.2-${{ matrix.platform }}-corresponding-source.tar.gz"
          python scripts/release_audit.py --check \
            --dist-dir "dist/Doc Media Toolkit.app" \
            --with-sbom "release-assets/SBOM-${{ matrix.platform }}.cdx.json" \
            --output "release-assets/RELEASE-AUDIT-${{ matrix.platform }}.md"

      - name: Build Windows GUI portable directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          python scripts/build_standalone.py --gui --target-platform windows --clean --bundle-ffmpeg --require-ffmpeg-bundle --name "Doc Media Toolkit"
          $appPath = "dist/Doc Media Toolkit/Doc Media Toolkit.exe"
          if (-not (Test-Path $appPath)) { throw 'Windows executable is missing.' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath $appPath -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) { throw "GUI smoke test exited early with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
          Copy-Item "release-assets/ffmpeg-runtime/FFMPEG-BUILD.txt" "release-assets/FFMPEG-${{ matrix.platform }}.txt"
          Move-Item "release-assets/ffmpeg-runtime/Doc-Media-Toolkit-FFmpeg-8.1.2-corresponding-source.tar.gz" "release-assets/Doc-Media-Toolkit-FFmpeg-8.1.2-${{ matrix.platform }}-corresponding-source.tar.gz"
          Compress-Archive -Path "dist/Doc Media Toolkit" -DestinationPath "release-assets/Doc-Media-Toolkit-${{ matrix.platform }}-portable.zip" -Force
          python scripts/release_audit.py --check `
            --dist-dir "dist/Doc Media Toolkit" `
            --with-sbom "release-assets/SBOM-${{ matrix.platform }}.cdx.json" `
            --output "release-assets/RELEASE-AUDIT-${{ matrix.platform }}.md"

      - name: Remove macOS build-only FFmpeg staging
        if: runner.os == 'macOS'
        run: rm -rf "release-assets/ffmpeg-runtime"

      - name: Remove Windows build-only FFmpeg staging
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Recurse -Force "release-assets/ffmpeg-runtime"

      - name: Write macOS checksums
        if: runner.os == 'macOS'
        run: |
          cd release-assets
          shasum -a 256 * > "SHA256SUMS-${{ matrix.platform }}.txt"

      - name: Write Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "release-assets/SHA256SUMS-${{ matrix.platform }}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
