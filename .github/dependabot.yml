# Dependabot configuration for Doc Media Toolkit.
# GitHub Actions versions are already pinned by full commit SHA; Dependabot
# proposes updates when new SHAs are released. Python dependencies follow
# uv.lock. Security updates are enabled on the repository regardless.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
